name: Lighthouse Audit (manual)

# 🚨 THIS FILE USED TO BE A SECOND, COMPETING DEPLOY PIPELINE.
#
# It carried the same `build-and-test` + `lighthouse-ci` jobs as
# `ci-cd-pipeline.yml` AND the same push/pull_request triggers on `main` and
# `develop` — so every push ran both workflows, and a push to `main` had two
# jobs racing to deploy production from the same commit.
#
# Its deploy jobs were removed rather than repaired, because every part of them
# pointed at something that does not exist:
#   * `vapor deploy staging` — `vapor.yml` defines `development` and
#     `production`. There is no `staging` environment.
#   * `https://staging.spennypiggy.co` — not a domain in `vapor.yml` (the two
#     domains are `dev.spennypiggy.co` and `spennypiggy.co`).
#   * `npm install -g laravel-vapor-cli` then `vapor login --token` — the CLI
#     this project actually uses is the composer one (`laravel/vapor-cli`,
#     v1.70.2 in `vendor/`), and ITS `login` command accepts NO options at all,
#     so `--token` is not a flag of the CLI in this repo. The npm package is
#     UNVERIFIED — nothing in this repository depends on it.
#   * `deploy-production: needs: deploy-staging` — the same dead chain fixed in
#     `ci-cd-pipeline.yml`: staging is develop-only, production is main-only.
#
# Deploys now live in ONE place: `.github/workflows/ci-cd-pipeline.yml`.
#
# TODO(human): this file is now entirely duplicated by `ci-cd-pipeline.yml`
# (same build-and-test, same lighthouse-ci) and probably wants deleting outright.
# It is kept, manual-trigger-only, so nobody loses the production audit config
# below without deciding to.

on:
  # Manual only. Automatic triggers are what made this race the real pipeline.
  workflow_dispatch:

jobs:
  # Build and Test Job
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spennypiggy_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, iconv, json, mbstring, zip
        ini-values: post_max_size=256M, upload_max_filesize=256M, max_execution_time=300
        coverage: xdebug
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Copy environment file
      run: cp .env.example .env
      
    - name: Update environment for testing
      run: |
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
        sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=spennypiggy_test/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
        sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
        echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
        
    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: /tmp/composer-cache
        key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
        
    - name: Install Composer dependencies
      run: |
        composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
        
    - name: Install Node dependencies
      run: npm ci
      
    - name: Build assets
      run: npm run build
      
    - name: Generate application key
      run: php artisan key:generate
      
    - name: Run database migrations
      run: php artisan migrate --force
      
    - name: Run PHP tests
      run: php artisan test --coverage --min=80
      
    - name: Run ESLint
      run: npm run lint --if-present
      
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: success()
      
  # Lighthouse CI Performance Testing
  lighthouse-ci:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spennypiggy_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, iconv, json, mbstring, zip
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        composer install --no-progress --prefer-dist --optimize-autoloader
        npm ci
        
    - name: Build assets
      run: npm run build
      
    - name: Setup environment
      run: |
        cp .env.example .env
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
        sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=spennypiggy_test/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
        echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
        php artisan key:generate
        php artisan migrate --force
        
    - name: Start Laravel server
      run: php artisan serve --host=0.0.0.0 --port=8000 &
      env:
        APP_ENV: testing
        
    - name: Wait for server to start
      run: |
        timeout 30 bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 1; done' || echo "Server may not be responding to /health, trying root..."
        timeout 30 bash -c 'until curl -s -f http://localhost:8000/ > /dev/null; do sleep 1; done' || echo "Server started but may have issues"
        
    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli@0.12.x
      
    - name: Run Lighthouse CI
      run: lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        LHCI_BUILD_CONTEXT__COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        
    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: lighthouse-results
        path: .lighthouseci/
        
  # A deep Lighthouse audit of the LIVE production site. It does not deploy and
  # never did anything but measure; it only ever hung off `deploy-production`
  # for ordering. Run it by hand after a production deploy.
  performance-monitoring:
    runs-on: ubuntu-latest
    
    steps:
    - name: Wait for deployment to stabilize
      run: sleep 120
      
    - name: Run comprehensive performance test
      run: |
        npx @lhci/cli@0.12.x autorun \
          --upload.target=temporary-public-storage \
          --collect.url=https://spennypiggy.co \
          --collect.numberOfRuns=10 \
          --collect.settings.onlyCategories=performance \
          --assert.assertMatrix[0].matchingUrlPattern=https://spennypiggy.co \
          --assert.assertMatrix[0].assertions.categories:performance=0.85 \
          --assert.assertMatrix[0].assertions.categories:accessibility=0.90 \
          --assert.assertMatrix[0].assertions.categories:best-practices=0.85 \
          --assert.assertMatrix[0].assertions.categories:seo=0.90
          
    - name: Upload performance monitoring results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: production-performance-results
        path: .lighthouseci/
        retention-days: 30
