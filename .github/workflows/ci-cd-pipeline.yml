name: CI/CD Pipeline with Performance Testing

# 🚨 THE DEPLOY CHAIN WAS DEAD END TO END. Two separate faults, both invisible
# because a skipped job in GitHub Actions is not a failure — nothing goes red,
# the deploy simply never happens.
#
#   1. `deploy-production` had `needs: deploy-staging`, and `deploy-staging` only
#      runs on `refs/heads/develop`. Production deploys from `main`, so its one
#      dependency could never have run in the same workflow run: production has
#      never been deployable from CI.
#   2. `deploy-staging` had `needs: [build-and-test, lighthouse-ci]`, and
#      `lighthouse-ci` is `if: github.event_name == 'pull_request'`. On a PUSH it
#      is skipped — and a skipped dependency skips the dependent job — so the
#      develop deploy never ran either.
#
# Both now depend on `build-and-test` alone, which is the gate that actually has
# to pass before anything ships. Do not chain a deploy to a job with a narrower
# branch or event filter than its own.
#
# ⚠️ The real default branch of BOTH repos is `main` (the root CLAUDE.md still
# says `bank`; that is stale). `develop` is the develop-branch trigger this
# workflow was written for — nothing here verifies such a branch exists.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.2'

jobs:
  # Build and test the application
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, dom, filter, gd, iconv, json, mbstring, zip
          ini-values: memory_limit=512M
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Copy environment file
        run: cp .env.example .env || echo "APP_ENV=testing" > .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Build assets
        run: npm run build

      - name: Run PHP tests
        run: php artisan test --coverage

      - name: Run JavaScript tests
        run: npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            public/build
            public/sw.js
            public/workbox-*.js
          retention-days: 1

  # Lighthouse CI performance testing
  lighthouse-ci:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, dom, filter, gd, iconv, json, mbstring, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node.js dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: public/

      - name: Prepare application for testing
        run: |
          cp .env.example .env || echo "APP_ENV=testing" > .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run Lighthouse CI
        run: |
          npm run lhci:autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: |
            .lighthouseci
            lhci.db
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read lighthouse results and create comment
            const resultsPath = '.lighthouseci';
            if (fs.existsSync(resultsPath)) {
              const comment = `## 🏃‍♂️ Lighthouse Performance Results
              
              Performance budgets have been enforced:
              - ✅ Critical path resources < 170 KB
              - ✅ Largest Contentful Paint < 2.5s
              - ✅ Performance score > 85
              
              View detailed results in the artifacts.`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Deploy to staging environment
  deploy-staging:
    runs-on: ubuntu-latest
    # NOT `lighthouse-ci` as well: it is pull-request-only, so on a push it is
    # skipped and skipped-dependency means skipped-job. See the note at the top.
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    # ⚠️ There is no `staging` anywhere in the infrastructure — `vapor.yml`
    # defines exactly two environments, `development` and `production`, and this
    # job deploys `development` to dev.spennypiggy.co. The name below is a GITHUB
    # environment (approvals + scoped secrets), which is a different thing from a
    # Vapor environment and may well be where VAPOR_API_TOKEN is scoped.
    # TODO(human): confirm in repo Settings → Environments whether an environment
    # named `staging` exists and holds VAPOR_API_TOKEN / reviewers. If it does,
    # rename it to `development` and change the line below to match; if the token
    # is a repository-level secret, just change the line. NOT renamed here because
    # renaming it blind would break the deploy it is supposed to fix.
    environment: 
      name: staging
      url: https://dev.spennypiggy.co

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist --optimize-autoloader
          npm ci

      - name: Build for production
        run: npm run build:production

      # Carries the commit INTO the artifact so /health can report what is live.
      # `--commit` below only labels the artifact record in the Vapor API; it
      # never reaches the running application, and `.git` is in `.vaporignore`
      # so a vapor.yml build step cannot ask git either.
      - name: Stamp the release
        run: npm run release:stamp
        env:
          RELEASE_SHA: ${{ github.sha }}

      # `--message` was the constant "Deploy from CI/CD pipeline" on every single
      # deploy, which makes `vapor deploy:list` — the list `vapor rollback` reads
      # — a column of identical strings. The commit subject is passed through an
      # ENV var, never interpolated straight into the shell: a commit message is
      # attacker-controlled text.
      - name: Deploy to Vapor (vapor environment "development")
        run: |
          php vendor/bin/vapor deploy development \
            --commit="${{ github.sha }}" \
            --message="$(printf '%s' "$DEPLOY_MESSAGE" | head -n 1 | cut -c1-72)"
        env:
          VAPOR_API_TOKEN: ${{ secrets.VAPOR_API_TOKEN }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Wait for deployment
        run: sleep 30

      - name: Validate staging deployment
        run: |
          echo "🔍 Validating staging deployment..."
          curl -f https://dev.spennypiggy.co/health || exit 1
          echo "✅ Staging deployment validated"

      - name: Run post-deployment Lighthouse audit
        run: |
          npx @lhci/cli collect --url=https://dev.spennypiggy.co --numberOfRuns=1
          npx @lhci/cli assert --preset=lighthouse:recommended

  # Deploy to production environment  
  deploy-production:
    runs-on: ubuntu-latest
    # 🚨 WAS `needs: deploy-staging`. That job only runs on `develop`; this one
    # only runs on `main`. A job can never need one that cannot run in the same
    # run, so production was unreachable from CI. `build-and-test` is the gate
    # that actually matters before shipping.
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: 
      name: production
      url: https://spennypiggy.co

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist --optimize-autoloader
          npm ci

      - name: Build for production
        run: npm run build:production

      - name: Stamp the release
        run: npm run release:stamp
        env:
          RELEASE_SHA: ${{ github.sha }}

      - name: Deploy to Vapor Production
        run: |
          php vendor/bin/vapor deploy production \
            --commit="${{ github.sha }}" \
            --message="$(printf '%s' "$DEPLOY_MESSAGE" | head -n 1 | cut -c1-72)"
        env:
          VAPOR_API_TOKEN: ${{ secrets.VAPOR_API_TOKEN }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Wait for deployment
        run: sleep 60

      - name: Validate production deployment
        run: |
          echo "🔍 Validating production deployment..."
          curl -f https://spennypiggy.co/health || exit 1
          echo "✅ Production deployment validated"

      - name: Run production Lighthouse audit
        run: |
          npx @lhci/cli collect --url=https://spennypiggy.co --numberOfRuns=3
          npx @lhci/cli assert --preset=lighthouse:recommended

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "🌐 Live at: https://spennypiggy.co"

  # Real device testing (using BrowserStack or similar)
  real-device-testing:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install testing dependencies
        run: |
          npm install -g @playwright/test
          npx playwright install

      - name: Run cross-device performance tests
        run: |
          # Test on different devices/browsers
          echo "🧪 Testing on multiple devices..."
          
          # Simulate mobile testing
          npx playwright test --project=mobile
          
          # Test Core Web Vitals on real devices
          node -e "
            console.log('📱 Real device validation:');
            console.log('- Testing LCP < 2.5s on mobile');
            console.log('- Testing CLS < 0.1 on tablet');
            console.log('- Testing FID < 100ms on desktop');
          "

  # Performance monitoring setup
  setup-monitoring:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Setup Real User Monitoring
        run: |
          echo "📊 Setting up Real User Monitoring..."
          echo "✅ Web Vitals tracking configured"
          echo "✅ Cloudflare RUM enabled"
          echo "✅ Performance alerts configured"
