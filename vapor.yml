id: 54327
name: SpennyPiggy
environments:
  development:
    memory: 2048
    queue-memory: 1024
    cli-memory: 512
    timeout: 30
    runtime: "php-8.2:al2"
    domain: dev.spennypiggy.co
    database: spennypiggy-db-dev
    build:
      - "composer install --no-dev"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      - "php artisan config:cache"
      - "npm ci"
      - "rm -rf public/build"
      - "npm run build"
      # - "npm run clear"
      - "rm -rf node_modules"   # Linux/macOS
      - "rm -rf package-lock.json"   # Linux/macOS
      # - "rd /s /q node_modules"  # Windows/
    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"

  production:
    memory: 3008
    queue-memory: 2048
    cli-memory: 2048
    warm: 20
    gateway-version: 2
    timeout: 60
    cache: spennypiggy-cache
    runtime: "php-8.2:al2"
    domain: spennypiggy.co
    database: spennypiggy-db
    database-proxy: true
    health-checks: false
    build:
      - "composer install --no-dev"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      - "php artisan config:cache"
      - "npm ci"
      - "rm -rf public/build" # Linux/mac/OS
      - "npm run build"
      # - "npm run clear"
      - "rm -rf node_modules" # Linux/mac/OS
      - "rm -rf package-lock.json"   # Linux/macOS
      # - "rd /s /q node_modules" # Windows
    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"



# php vendor/bin/vapor asset:clear production
# php vendor/bin/vapor command production --command="php artisan optimize:clear"
# php vendor/bin/vapor deploy production --message='clean deployment after cache clear'

