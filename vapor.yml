id: 54327
name: SpennyPiggy
environments:
  development:
    memory: 2048
    queue-memory: 1024
    scheduler: true
    nodejs: 18
    warm: 1
    gateway-version: 2
    cli-timeout: 120
    cli-concurrency: 10
    cli-memory: 512
    timeout: 120
    runtime: "php-8.2:al2"
    domain: dev.spennypiggy.co
    database: spennypiggy-db-dev
    cache: spenny-piggy-redis-caches
    health-checks: false
    assets:
      - "public/build/**"
    build:
      - "composer install"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      - "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-audit --no-fund"
      - "php artisan ziggy:generate"
      - "npm run build"
      - "rm -rf node_modules/.DS_Store || true"
      - "rm -rf node_modules || rm -rf node_modules"
      # - "rd /s /q node_modules"
      # - "rd /s /q package-lock.json"
 
    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"

  production:
    memory: 1024
    queue-memory: 512
    cli-memory: 1024
    nodejs: 18
    scheduler: true
    cli-timeout: 120
    cli-concurrency: 10
    warm: 1
    gateway-version: 2
    timeout: 60
    cache: spenny-piggy-redis-caches
    runtime: "php-8.2:al2"
    domain: spennypiggy.co
    database: spennypiggy-db
    database-proxy: true
    health-checks: false 
    assets:
      - "public/build/**"
    build:
      - "composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader"
      - "php artisan event:cache"
      - "php artisan optimize:clear" 
      - "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-audit --no-fund"
      - "php artisan ziggy:generate" 
      - "npm run build" 
      - "rm -rf node_modules/.DS_Store || true"
      - "rm -rf node_modules || rm -rf node_modules"
      - "php artisan config:clear"
      - "php artisan config:cache"
      - "php artisan route:clear"
      - "php artisan view:clear"
      - "php artisan event:clear"
      - "php artisan cache:clear"

    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"

