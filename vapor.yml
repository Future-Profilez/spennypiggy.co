id: 54327
name: SpennyPiggy
environments:
  development:
    memory: 2048
    queue-memory: 1024
    cli-memory: 512
    timeout: 30
    runtime: "php-8.2:al2"
    domain: dev.spennypiggy.co
    database: spennypiggy-db-dev
    build:
      # - "composer install --no-dev"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      - "php artisan config:cache"
      - "npm ci"
      - "npm run build"
      # - "rm -rf node_modules"   # Linux/macOS
      - "rd /s /q node_modules"  # Windows/
    deploy:
      - "php artisan migrate --force"

  production:
    memory: 3008
    queue-memory: 2048
    cli-memory: 2048
    warm: 10
    gateway-version: 2
    timeout: 30
    cache: spennypiggy-cache
    runtime: "php-8.2:al2"
    domain: spennypiggy.co
    database: spennypiggy-db
    database-proxy: true
    build:
      - "composer install --no-dev"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      - "php artisan config:cache"
      - "php artisan route:cache"
      - "npm ci"
      - "npm run build"
      # - "rm -rf node_modules" # Linux/mac/OS
      - "rd /s /q node_modules" # Windows
    deploy:
      - "php artisan migrate --force"


