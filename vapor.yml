id: 54327
name: SpennyPiggy
environments:
  development:
    memory: 2048
    queue-memory: 1024
    scheduler: true
    nodejs: 18
    warm: 1
    gateway-version: 2
    # Every command due in the same minute runs sequentially inside ONE
    # schedule:run invocation, so this is the budget for the whole minute, not
    # for one command. At 120 the :00 and :30 ticks were being killed mid-run —
    # 21 times in a single day on this environment (7 Aug 2026) — and because
    # Vapor only flushes output when the invocation ends, a killed minute logged
    # NOTHING, which is indistinguishable from the scheduler never firing.
    # Lambda's ceiling is 900.
    cli-timeout: 600
    cli-concurrency: 10
    cli-memory: 512
    timeout: 120
    runtime: "php-8.2:al2"
    domain: dev.spennypiggy.co
    database: spennypiggy-db-dev
    cache: spenny-piggy-redis-caches
    health-checks: false
    assets:
      - "public/build/**"
    build:
      - "composer install"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      - "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-audit --no-fund"
      - "php artisan ziggy:generate"
      # build:production = vite build + sw:build. Plain `npm run build` skips the
      # service worker, so every deploy shipped the PWA without a fresh SW.
      - "npm run build:production"
      - "rm -rf node_modules/.DS_Store || true"
      - "rm -rf node_modules || rm -rf node_modules"
      # - "rd /s /q node_modules"
      # - "rd /s /q package-lock.json"

    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"
      # Queries the users table, so it can only run after deploy — the build
      # container has no database connection.
      - "php artisan stripe:request-bank-capabilities"

  production:
    memory: 1024
    queue-memory: 512
    cli-memory: 1024
    nodejs: 18
    scheduler: true
    # See the note on the development environment above. The weekly payout run
    # was the casualty here: its 10:00 Friday invocation was killed at exactly
    # 120,000 ms and never started.
    cli-timeout: 600
    cli-concurrency: 10
    warm: 1
    gateway-version: 2
    timeout: 60
    cache: spenny-piggy-redis-caches
    runtime: "php-8.2:al2"
    domain: spennypiggy.co
    database: spennypiggy-db
    database-proxy: true
    health-checks: false 
    assets:
      - "public/build/**"
    build:
      - "composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      - "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-audit --no-fund"
      - "php artisan ziggy:generate"
      # build:production = vite build + sw:build. Plain `npm run build` skips the
      # service worker, so every deploy shipped the PWA without a fresh SW.
      - "npm run build:production"
      - "rm -rf node_modules/.DS_Store || true"
      - "rm -rf node_modules || rm -rf node_modules"
      - "php artisan config:clear"
      - "php artisan config:cache"
      - "php artisan route:clear"
      - "php artisan view:clear"
      - "php artisan event:clear"
      - "php artisan cache:clear"

    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"
      # Queries the users table, so it can only run after deploy — the build
      # container has no database connection.
      - "php artisan stripe:request-bank-capabilities"

