id: 54327
name: SpennyPiggy
environments:
  development:
    memory: 2048
    queue-memory: 1024
    scheduler: true
    cli-timeout: 120
    cli-concurrency: 10
    cli-memory: 512
    timeout: 120
    runtime: "php-8.2:al2"
    domain: dev.spennypiggy.co
    database: spennypiggy-db-dev
    cache: spenny-piggy-redis-caches
    assets:
      - "public/build/**"
    build:
      - "composer install"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      # - "npm install --no-audit --no-fund"
      - "php artisan ziggy:generate"
      - "rm -rf public/build" 
      - "rm -rf bootstrap/ssr"
      - "npm run build"
      - "npm run clear"
      - "rm -rf node_modules"
      - "rm -rf package-lock.json"
      # - "rd /s /q node_modules" # Windows
    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"
      - "php artisan config:clear"
      - "php artisan config:cache"
      - "php artisan route:clear"
      - "php artisan view:clear"
      - "php artisan event:clear"
      # - "php artisan subscription:sync --all"
      # - "php artisan app:process-task-auto-confirmations"
      # - "php artisan app:process-sla-refunds"
      # - "php artisan sitemap:generate --force"
  production:
    memory: 1024
    queue-memory: 512
    cli-memory: 1024
    nodejs: 18
    scheduler: true
    cli-timeout: 120
    cli-concurrency: 10
    warm: 1
    gateway-version: 2
    timeout: 60
    cache: spenny-piggy-redis-caches
    runtime: "php-8.2:al2"
    domain: spennypiggy.co
    database: spennypiggy-db
    database-proxy: true
    health-checks: false 
    assets:
      - "public/build/**"
    build:
      # - "composer install --no-dev"
      - "php artisan event:cache"
      - "php artisan optimize:clear"
      # - "npm install --no-audit --no-fund"
      - "php artisan ziggy:generate"
      - "rm -rf public/build"
      - "rm -rf bootstrap/ssr"
      - "npm run build"
      - "npm run clear"
      - "rm -rf node_modules"
      # - "rm -rf package-lock.json"   # Keep for npm ci in build process
      # - "rd /s /q node_modules" # Windows

    deploy:
      - "php artisan migrations:fix-state"
      - "php artisan migrate --force"
      - "php artisan config:clear"
      - "php artisan config:cache"
      - "php artisan route:clear"
      - "php artisan view:clear"
      - "php artisan event:clear"
      - "php artisan cache:clear"

# - "php artisan subscription:sync --all"
# - "php artisan sitemap:generate --force"
# php artisan app:notifications-pending-approval
