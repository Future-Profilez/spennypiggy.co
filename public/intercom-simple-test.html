<!DOCTYPE html>
<html>
<head>
    <title>Simple Intercom Test</title>
</head>
<body>
    <h1>Simple Intercom Test</h1>
    <p>This page tests Intercom loading with the basic method.</p>
    
    <button onclick="showIntercom()">Show Intercom</button>
    <button onclick="hideIntercom()">Hide Intercom</button>
    
    <script>
        console.log('🧪 Starting simple Intercom test...');
        
        // Set up Intercom settings
        window.intercomSettings = {
            api_base: "https://api-iam.intercom.io",
            app_id: "xomg14o9",
            name: "Test User",
            email: "test@example.com",
            user_id: "test123"
        };
        
        console.log('📋 Intercom settings:', window.intercomSettings);
        
        // Standard Intercom installation code
        (function(){var w=window;var ic=w.Intercom;if(typeof ic==="function"){ic('reattach_activator');ic('update',w.intercomSettings);}else{var d=document;var i=function(){i.c(arguments);};i.q=[];i.c=function(args){i.q.push(args);};w.Intercom=i;var l=function(){var s=d.createElement('script');s.type='text/javascript';s.async=true;s.src='https://widget.intercom.io/widget/xomg14o9';var x=d.getElementsByTagName('script')[0];x.parentNode.insertBefore(s,x);};if(document.readyState==='complete'){l();}else if(w.attachEvent){w.attachEvent('onload',l);}else{w.addEventListener('load',l,false);}}})();
        
        function showIntercom() {
            console.log('🔍 Attempting to show Intercom...');
            if (window.Intercom) {
                window.Intercom('show');
                console.log('✅ Show command sent');
            } else {
                console.log('❌ Intercom not available');
            }
        }
        
        function hideIntercom() {
            console.log('🔍 Attempting to hide Intercom...');
            if (window.Intercom) {
                window.Intercom('hide');
                console.log('✅ Hide command sent');
            } else {
                console.log('❌ Intercom not available');
            }
        }
        
        // Check if Intercom loads
        setTimeout(() => {
            console.log('⏰ 3-second check:');
            console.log('  - window.Intercom type:', typeof window.Intercom);
            console.log('  - Launcher found:', !!document.querySelector('.intercom-launcher'));
            console.log('  - Messenger found:', !!document.querySelector('.intercom-messenger'));
            
            const frames = document.querySelectorAll('iframe');
            console.log('  - Total iframes:', frames.length);
            frames.forEach((frame, i) => {
                console.log(`    Frame ${i}: ${frame.src} (${frame.name})`);
            });
        }, 3000);
    </script>
</body>
</html>
