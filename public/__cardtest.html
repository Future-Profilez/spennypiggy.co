<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/build/css/app-Dz52Lo7H.css">
<style>body{margin:0;background:#eee}h3{font:12px monospace;margin:6px}#out{border:2px solid lime}</style>
</head>
<body>
<h3>LIVE DOM</h3><div id="host"></div>
<h3>RASTER</h3><div id="out"></div>
<script src="/__h2c.js"></script>
<script>
const NAME_FONT_SIZE = 43;
const NAME_LINE_HEIGHT = 1.02;
const cardName = "THE THOR MAN";
const cardUsername = "thor";
const cardCategory = "Developer";
const spennypiggy = "/__logo.png";
const avatarSrc = "/__logo.png";
const esc = s => String(s);
const arc = (r,a) => `<div style="position:absolute;width:${r*2}px;height:${r*2}px;left:${620-r}px;top:${352-r}px;border-radius:50%;background:rgba(255,255,255,${a});"></div>`;

document.getElementById('host').innerHTML = `
  <div id="card-to-capture" style="position:relative;width:600px;height:337.5px;color:#fff;overflow:hidden;font-family:'CeraGR',system-ui,sans-serif;background:linear-gradient(118deg,#8C0F45 0%,#C21367 46%,#FF2E93 100%);">
    ${arc(280,0.05)}${arc(215,0.05)}${arc(150,0.05)}${arc(88,0.05)}
    <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.13) 1.2px,transparent 1.3px);background-size:17px 17px;"></div>
    <div style="position:absolute;inset:0;z-index:2;padding:27px 32px;display:flex;flex-direction:column;justify-content:center;">
      <div style="display:table;width:100%;table-layout:fixed;">
        <div style="display:table-cell;width:127px;vertical-align:middle;">
          <div style="width:108px;height:108px;border-radius:50%;padding:4px;background:linear-gradient(150deg,#A2E4B8,#E6EA7B 62%,#A2E4B8);box-shadow:0 9px 20px rgba(0,0,0,0.42);">
            <img src="${avatarSrc}" crossorigin="anonymous" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;" />
          </div>
        </div>
        <div style="display:table-cell;vertical-align:middle;overflow:hidden;">
          <div id="card-name" style="font-family:'gulfs',system-ui,sans-serif;font-size:${NAME_FONT_SIZE}px;line-height:${NAME_LINE_HEIGHT};text-transform:uppercase;letter-spacing:0.5px;color:#fff;text-shadow:0 1.5px 0 rgba(0,0,0,0.34);overflow-wrap:break-word;">${esc(cardName)}</div>
          <div id="card-pill" style="display:inline-block;margin-top:26px;background:#A2E4B8;color:#0B2B1A;border-radius:999px;padding:5px 12px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;">
            <span id="pill-dot" style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#0B2B1A;margin-right:6px;vertical-align:middle;"></span><span id="pill-text" style="vertical-align:middle;">${esc(cardCategory)}</span>
          </div>
        </div>
      </div>
      <div style="margin-top:12px;">
        <span style="font-size:16.5px;color:rgba(255,255,255,0.92);vertical-align:middle;">is now on</span><img src="${spennypiggy}" crossorigin="anonymous" style="height:30px;width:auto;display:inline-block;vertical-align:middle;margin-left:10px;" /></div>
      <div id="bar" style="display:table;width:100%;margin-top:19px;border-radius:11px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,0.36);">
        <div style="display:table-cell;width:62px;background:#0B0B0C;color:#fff;vertical-align:middle;text-align:center;padding:0 13px;font-size:9.5px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;">Visit</div>
        <div id="bar-url" style="display:table-cell;background:#fff;color:#0B0B0C;vertical-align:middle;padding:11px 8px 11px 15px;font-size:17px;font-weight:700;letter-spacing:-0.012em;white-space:nowrap;overflow:hidden;">spennypiggy.co/<span style="color:#C21367;">${esc(cardUsername)}</span></div>
        <div id="bar-logo" style="display:table-cell;width:82px;background:#fff;vertical-align:middle;padding:0 13px 0 3px;">
          <img src="${spennypiggy}" crossorigin="anonymous" style="height:19px;width:auto;display:block;" />
        </div>
      </div>
    </div>
  </div>`;

window.__done=false;
(async () => {
  const card=document.getElementById('card-to-capture');
  await Promise.all([...card.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r;})));
  await document.fonts.ready;
  await new Promise(r=>setTimeout(r,300));
  window.__card = card;
  window.__done = true;
})();
</script>
</body>
</html>
