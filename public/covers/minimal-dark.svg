<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFD700" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFD700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pinkLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D9B" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF2D9B" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FF2D9B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF2D9B" stop-opacity="0"/>
    </linearGradient>
    <filter id="darkGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="darkGlow2">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgDark)"/>

  <!-- Very subtle dot grid -->
  <g fill="#333" opacity="0.5">
    <circle cx="100" cy="60" r="1"/> <circle cx="200" cy="60" r="1"/> <circle cx="300" cy="60" r="1"/>
    <circle cx="400" cy="60" r="1"/> <circle cx="500" cy="60" r="1"/> <circle cx="600" cy="60" r="1"/>
    <circle cx="700" cy="60" r="1"/> <circle cx="800" cy="60" r="1"/> <circle cx="900" cy="60" r="1"/>
    <circle cx="1000" cy="60" r="1"/> <circle cx="1100" cy="60" r="1"/>
    <circle cx="100" cy="120" r="1"/> <circle cx="200" cy="120" r="1"/> <circle cx="300" cy="120" r="1"/>
    <circle cx="400" cy="120" r="1"/> <circle cx="500" cy="120" r="1"/> <circle cx="600" cy="120" r="1"/>
    <circle cx="700" cy="120" r="1"/> <circle cx="800" cy="120" r="1"/> <circle cx="900" cy="120" r="1"/>
    <circle cx="1000" cy="120" r="1"/> <circle cx="1100" cy="120" r="1"/>
    <circle cx="100" cy="180" r="1"/> <circle cx="200" cy="180" r="1"/> <circle cx="300" cy="180" r="1"/>
    <circle cx="400" cy="180" r="1"/> <circle cx="500" cy="180" r="1"/> <circle cx="600" cy="180" r="1"/>
    <circle cx="700" cy="180" r="1"/> <circle cx="800" cy="180" r="1"/> <circle cx="900" cy="180" r="1"/>
    <circle cx="1000" cy="180" r="1"/> <circle cx="1100" cy="180" r="1"/>
    <circle cx="100" cy="240" r="1"/> <circle cx="200" cy="240" r="1"/> <circle cx="300" cy="240" r="1"/>
    <circle cx="400" cy="240" r="1"/> <circle cx="500" cy="240" r="1"/> <circle cx="600" cy="240" r="1"/>
    <circle cx="700" cy="240" r="1"/> <circle cx="800" cy="240" r="1"/> <circle cx="900" cy="240" r="1"/>
    <circle cx="1000" cy="240" r="1"/> <circle cx="1100" cy="240" r="1"/>
  </g>

  <!-- Side gold accent bars -->
  <rect x="0" y="0" width="4" height="300" fill="url(#goldLine)" transform="rotate(90,0,0) translate(-300,0)" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="300" stroke="url(#goldLine)" stroke-width="3" opacity="0"/>
  <!-- Left bar -->
  <rect x="0" y="80" width="3" height="140" fill="#FFD700" opacity="0.6" filter="url(#darkGlow)"/>
  <!-- Right bar -->
  <rect x="1197" y="80" width="3" height="140" fill="#FFD700" opacity="0.6" filter="url(#darkGlow)"/>

  <!-- Horizontal gold lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="url(#goldLine)" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="url(#goldLine)" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="148" x2="1200" y2="148" stroke="url(#pinkLine)" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="152" x2="1200" y2="152" stroke="url(#pinkLine)" stroke-width="1" opacity="0.4"/>

  <!-- Corner decorative elements -->
  <g stroke="#FFD700" stroke-width="2" fill="none" opacity="0.7" filter="url(#darkGlow)">
    <!-- Top left corner -->
    <line x1="30" y1="30" x2="80" y2="30"/>
    <line x1="30" y1="30" x2="30" y2="80"/>
    <!-- Top right corner -->
    <line x1="1170" y1="30" x2="1120" y2="30"/>
    <line x1="1170" y1="30" x2="1170" y2="80"/>
    <!-- Bottom left corner -->
    <line x1="30" y1="270" x2="80" y2="270"/>
    <line x1="30" y1="270" x2="30" y2="220"/>
    <!-- Bottom right corner -->
    <line x1="1170" y1="270" x2="1120" y2="270"/>
    <line x1="1170" y1="270" x2="1170" y2="220"/>
  </g>

  <!-- Center diamond -->
  <g transform="translate(600,150)" filter="url(#darkGlow2)">
    <polygon points="0,-55 45,0 0,55 -45,0" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.7"/>
    <polygon points="0,-38 30,0 0,38 -30,0" fill="none" stroke="#FF2D9B" stroke-width="1" opacity="0.5"/>
    <polygon points="0,-20 16,0 0,20 -16,0" fill="#FFD700" opacity="0.15"/>
    <!-- inner glow dot -->
    <circle cx="0" cy="0" r="4" fill="#FFD700" opacity="0.9" filter="url(#darkGlow)"/>
  </g>

  <!-- Side diamonds small -->
  <g transform="translate(200,150)" filter="url(#darkGlow)">
    <polygon points="0,-30 24,0 0,30 -24,0" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700" opacity="0.7"/>
  </g>
  <g transform="translate(1000,150)" filter="url(#darkGlow)">
    <polygon points="0,-30 24,0 0,30 -24,0" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700" opacity="0.7"/>
  </g>
  <g transform="translate(400,150)" filter="url(#darkGlow)">
    <polygon points="0,-18 14,0 0,18 -14,0" fill="none" stroke="#FF2D9B" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="2" fill="#FF2D9B" opacity="0.6"/>
  </g>
  <g transform="translate(800,150)" filter="url(#darkGlow)">
    <polygon points="0,-18 14,0 0,18 -14,0" fill="none" stroke="#FF2D9B" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="2" fill="#FF2D9B" opacity="0.6"/>
  </g>

  <!-- Gold sparkle stars -->
  <g filter="url(#darkGlow)">
    <path d="M150,80 L153,90 L163,93 L153,96 L150,106 L147,96 L137,93 L147,90 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M1050,80 L1053,90 L1063,93 L1053,96 L1050,106 L1047,96 L1037,93 L1047,90 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M150,220 L153,230 L163,233 L153,236 L150,246 L147,236 L137,233 L147,230 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M1050,220 L1053,230 L1063,233 L1053,236 L1050,246 L1047,236 L1037,233 L1047,230 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M350,60 L352,68 L360,70 L352,72 L350,80 L348,72 L340,70 L348,68 Z" fill="#FF2D9B" opacity="0.7"/>
    <path d="M850,60 L852,68 L860,70 L852,72 L850,80 L848,72 L840,70 L848,68 Z" fill="#FF2D9B" opacity="0.7"/>
    <path d="M350,240 L352,248 L360,250 L352,252 L350,260 L348,252 L340,250 L348,248 Z" fill="#FF2D9B" opacity="0.7"/>
    <path d="M850,240 L852,248 L860,250 L852,252 L850,260 L848,252 L840,250 L848,248 Z" fill="#FF2D9B" opacity="0.7"/>
  </g>

  <!-- Tiny gold dots scattered -->
  <g fill="#FFD700" filter="url(#darkGlow)">
    <circle cx="100" cy="150" r="2" opacity="0.5"/>
    <circle cx="500" cy="70" r="2" opacity="0.4"/>
    <circle cx="700" cy="70" r="2" opacity="0.4"/>
    <circle cx="500" cy="230" r="2" opacity="0.4"/>
    <circle cx="700" cy="230" r="2" opacity="0.4"/>
    <circle cx="1100" cy="150" r="2" opacity="0.5"/>
  </g>
</svg>
