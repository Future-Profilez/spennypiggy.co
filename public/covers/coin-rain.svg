<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#1A0A00"/>
    </linearGradient>
    <radialGradient id="coinG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFE97A"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <filter id="coinGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coinGlow2">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgCoin)"/>

  <!-- Background stars -->
  <g fill="#FFD700" opacity="0.2">
    <circle cx="80" cy="30" r="1.5"/> <circle cx="200" cy="20" r="1"/>
    <circle cx="360" cy="45" r="1.5"/> <circle cx="520" cy="15" r="1"/>
    <circle cx="680" cy="35" r="2"/> <circle cx="840" cy="20" r="1"/>
    <circle cx="1000" cy="50" r="1.5"/> <circle cx="1160" cy="25" r="1"/>
  </g>

  <!-- Coin helper macro: define reusable coin shapes at different sizes and positions -->
  <!-- Large coins -->
  <g filter="url(#coinGlow)">
    <!-- Coin 1 -->
    <g transform="translate(80,50)">
      <ellipse cx="0" cy="0" rx="36" ry="36" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="33" ry="33" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="26" ry="26" fill="#DAA520"/>
      <text x="0" y="10" text-anchor="middle" font-size="22" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 2 -->
    <g transform="translate(210,120)">
      <ellipse cx="0" cy="0" rx="28" ry="28" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="25" ry="25" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="19" ry="19" fill="#DAA520"/>
      <text x="0" y="8" text-anchor="middle" font-size="16" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 3 large -->
    <g transform="translate(340,40)">
      <ellipse cx="0" cy="0" rx="42" ry="42" fill="#222" stroke="#FFD700" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="39" ry="39" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="31" ry="31" fill="#DAA520"/>
      <text x="0" y="12" text-anchor="middle" font-size="26" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 4 -->
    <g transform="translate(480,180)">
      <ellipse cx="0" cy="0" rx="32" ry="32" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="29" ry="29" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="22" ry="22" fill="#DAA520"/>
      <text x="0" y="9" text-anchor="middle" font-size="18" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 5 medium -->
    <g transform="translate(600,60)">
      <ellipse cx="0" cy="0" rx="35" ry="35" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="32" ry="32" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="25" ry="25" fill="#DAA520"/>
      <text x="0" y="10" text-anchor="middle" font-size="20" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 6 large -->
    <g transform="translate(720,170)">
      <ellipse cx="0" cy="0" rx="44" ry="44" fill="#222" stroke="#FFD700" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="41" ry="41" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="33" ry="33" fill="#DAA520"/>
      <text x="0" y="13" text-anchor="middle" font-size="28" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 7 -->
    <g transform="translate(870,50)">
      <ellipse cx="0" cy="0" rx="30" ry="30" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="27" ry="27" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="21" ry="21" fill="#DAA520"/>
      <text x="0" y="9" text-anchor="middle" font-size="18" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 8 large -->
    <g transform="translate(1000,130)">
      <ellipse cx="0" cy="0" rx="40" ry="40" fill="#222" stroke="#FFD700" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="37" ry="37" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="29" ry="29" fill="#DAA520"/>
      <text x="0" y="11" text-anchor="middle" font-size="24" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 9 -->
    <g transform="translate(1130,50)">
      <ellipse cx="0" cy="0" rx="26" ry="26" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="23" ry="23" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="17" ry="17" fill="#DAA520"/>
      <text x="0" y="8" text-anchor="middle" font-size="14" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <!-- Coin 10 - bottom row -->
    <g transform="translate(130,230)">
      <ellipse cx="0" cy="0" rx="22" ry="22" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="19" ry="19" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="14" ry="14" fill="#DAA520"/>
      <text x="0" y="7" text-anchor="middle" font-size="12" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <g transform="translate(280,250)">
      <ellipse cx="0" cy="0" rx="18" ry="18" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="15" ry="15" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="11" ry="11" fill="#DAA520"/>
      <text x="0" y="6" text-anchor="middle" font-size="10" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <g transform="translate(540,240)">
      <ellipse cx="0" cy="0" rx="24" ry="24" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="21" ry="21" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="16" ry="16" fill="#DAA520"/>
      <text x="0" y="8" text-anchor="middle" font-size="13" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <g transform="translate(840,240)">
      <ellipse cx="0" cy="0" rx="20" ry="20" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="17" ry="17" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="13" ry="13" fill="#DAA520"/>
      <text x="0" y="7" text-anchor="middle" font-size="11" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
    <g transform="translate(1120,225)">
      <ellipse cx="0" cy="0" rx="25" ry="25" fill="#222" stroke="#FFD700" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="22" ry="22" fill="url(#coinG)"/>
      <ellipse cx="0" cy="0" rx="17" ry="17" fill="#DAA520"/>
      <text x="0" y="8" text-anchor="middle" font-size="14" font-weight="900" fill="#222" font-family="Arial Black">$</text>
    </g>
  </g>

  <!-- Gold sparkle trails (motion lines above coins) -->
  <g stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="80" y1="10" x2="80" y2="20"/>
    <line x1="340" y1="0" x2="340" y2="12"/>
    <line x1="600" y1="15" x2="600" y2="28"/>
    <line x1="720" y1="125" x2="720" y2="135"/>
    <line x1="1000" y1="85" x2="1000" y2="98"/>
    <line x1="480" y1="140" x2="480" y2="152"/>
  </g>

  <!-- Gold sparkle stars -->
  <g filter="url(#coinGlow2)">
    <path d="M440,100 L444,115 L459,119 L444,123 L440,138 L436,123 L421,119 L436,115 Z" fill="#FFD700"/>
    <path d="M950,100 L954,115 L969,119 L954,123 L950,138 L946,123 L931,119 L946,115 Z" fill="#FFD700"/>
    <path d="M160,160 L163,170 L173,173 L163,176 L160,186 L157,176 L147,173 L157,170 Z" fill="#FFE94D"/>
    <path d="M660,140 L663,150 L673,153 L663,156 L660,166 L657,156 L647,153 L657,150 Z" fill="#FFE94D"/>
  </g>
</svg>
