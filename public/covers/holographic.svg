<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="holo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6EC7"/>
      <stop offset="16%" stop-color="#FF9A3C"/>
      <stop offset="33%" stop-color="#FFE94D"/>
      <stop offset="50%" stop-color="#4DFFA0"/>
      <stop offset="66%" stop-color="#4DC8FF"/>
      <stop offset="83%" stop-color="#B44DFF"/>
      <stop offset="100%" stop-color="#FF6EC7"/>
    </linearGradient>
    <linearGradient id="holo2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B44DFF" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#4DC8FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4DFFA0" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#FFE94D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6EC7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="holoStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="holoBlur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="holoBlur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="300" fill="url(#holo1)"/>
  <!-- Overlay for depth -->
  <rect width="1200" height="300" fill="url(#holo2)"/>

  <!-- Holographic sheen stripes (diagonal) -->
  <g opacity="0.25">
    <rect x="-100" y="0" width="60" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="80" y="0" width="30" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="200" y="0" width="60" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="380" y="0" width="25" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="480" y="0" width="60" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="640" y="0" width="30" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="760" y="0" width="60" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="920" y="0" width="25" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="1020" y="0" width="60" height="300" fill="white" transform="skewX(-20)"/>
    <rect x="1180" y="0" width="30" height="300" fill="white" transform="skewX(-20)"/>
  </g>

  <!-- Horizontal sheen -->
  <rect width="1200" height="300" fill="url(#holoStripe)"/>

  <!-- Geometric diamond grid -->
  <g fill="none" stroke="white" stroke-width="1" opacity="0.2">
    <polygon points="600,50 750,150 600,250 450,150"/>
    <polygon points="600,80 720,150 600,220 480,150"/>
    <polygon points="600,110 690,150 600,190 510,150"/>
    <!-- Left diamond -->
    <polygon points="150,50 300,150 150,250 0,150"/>
    <polygon points="150,80 270,150 150,220 30,150"/>
    <!-- Right diamond -->
    <polygon points="1050,50 1200,150 1050,250 900,150"/>
    <polygon points="1050,80 1170,150 1050,220 930,150"/>
  </g>

  <!-- Sparkle dots (white) -->
  <g fill="white" filter="url(#holoBlur)">
    <circle cx="100" cy="50" r="5" opacity="0.9"/>
    <circle cx="300" cy="30" r="4" opacity="0.8"/>
    <circle cx="500" cy="60" r="6" opacity="0.9"/>
    <circle cx="700" cy="25" r="4" opacity="0.8"/>
    <circle cx="900" cy="55" r="5" opacity="0.9"/>
    <circle cx="1100" cy="35" r="4" opacity="0.8"/>
    <circle cx="200" cy="250" r="5" opacity="0.9"/>
    <circle cx="600" cy="270" r="4" opacity="0.8"/>
    <circle cx="1000" cy="260" r="6" opacity="0.9"/>
    <circle cx="400" cy="140" r="3" opacity="0.9"/>
    <circle cx="800" cy="160" r="3" opacity="0.9"/>
  </g>

  <!-- Star sparkles -->
  <g fill="white" opacity="0.9">
    <path d="M200,100 L204,116 L220,120 L204,124 L200,140 L196,124 L180,120 L196,116 Z" filter="url(#holoBlur)"/>
    <path d="M600,60 L604,74 L618,78 L604,82 L600,96 L596,82 L582,78 L596,74 Z" filter="url(#holoBlur)"/>
    <path d="M1000,100 L1004,114 L1018,118 L1004,122 L1000,136 L996,122 L982,118 L996,114 Z" filter="url(#holoBlur)"/>
    <path d="M400,180 L403,190 L413,193 L403,196 L400,206 L397,196 L387,193 L397,190 Z" filter="url(#holoBlur)"/>
    <path d="M800,180 L803,190 L813,193 L803,196 L800,206 L797,196 L787,193 L797,190 Z" filter="url(#holoBlur)"/>
    <path d="M100,200 L103,210 L113,213 L103,216 L100,226 L97,216 L87,213 L97,210 Z" filter="url(#holoBlur)"/>
    <path d="M1100,200 L1103,210 L1113,213 L1103,216 L1100,226 L1097,216 L1087,213 L1097,210 Z" filter="url(#holoBlur)"/>
  </g>

  <!-- Center highlight -->
  <ellipse cx="600" cy="150" rx="300" ry="100" fill="white" opacity="0.06" filter="url(#holoBlur)"/>
</svg>
