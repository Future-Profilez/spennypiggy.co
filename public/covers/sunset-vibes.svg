<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0050"/>
      <stop offset="30%" stop-color="#6B0050"/>
      <stop offset="60%" stop-color="#FF4500"/>
      <stop offset="80%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="sunGrad" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFE94D"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <radialGradient id="sunRad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE0"/>
      <stop offset="50%" stop-color="#FFE94D"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1A0050"/>
    </linearGradient>
    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow2">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky gradient -->
  <rect width="1200" height="300" fill="url(#bgSun)"/>

  <!-- Stars in upper dark sky -->
  <g fill="white" opacity="0.7">
    <circle cx="60" cy="25" r="1.5"/> <circle cx="180" cy="15" r="1"/>
    <circle cx="320" cy="30" r="2"/> <circle cx="480" cy="10" r="1"/>
    <circle cx="720" cy="20" r="1.5"/> <circle cx="900" cy="15" r="1"/>
    <circle cx="1050" cy="30" r="2"/> <circle cx="1170" cy="18" r="1"/>
    <circle cx="140" cy="50" r="1"/> <circle cx="400" cy="45" r="1.5"/>
    <circle cx="640" cy="40" r="1"/> <circle cx="840" cy="48" r="1.5"/>
    <circle cx="1100" cy="42" r="1"/>
  </g>

  <!-- Sun glow (big background) -->
  <circle cx="600" cy="210" r="200" fill="#FF8C00" opacity="0.15" filter="url(#sunGlow2)"/>
  <circle cx="600" cy="210" r="130" fill="#FFD700" opacity="0.2" filter="url(#sunGlow2)"/>

  <!-- Sun rays -->
  <g transform="translate(600,210)" filter="url(#sunGlow)">
    <g stroke="#FFE94D" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="0" y1="-120" x2="0" y2="-160"/>
      <line x1="57" y1="-104" x2="76" y2="-138"/>
      <line x1="104" y1="-57" x2="138" y2="-76"/>
      <line x1="120" y1="0" x2="160" y2="0"/>
      <line x1="104" y1="57" x2="138" y2="76"/>
      <line x1="57" y1="104" x2="76" y2="138"/>
      <line x1="0" y1="120" x2="0" y2="160"/>
      <line x1="-57" y1="104" x2="-76" y2="138"/>
      <line x1="-104" y1="57" x2="-138" y2="76"/>
      <line x1="-120" y1="0" x2="-160" y2="0"/>
      <line x1="-104" y1="-57" x2="-138" y2="-76"/>
      <line x1="-57" y1="-104" x2="-76" y2="-138"/>
    </g>
  </g>

  <!-- Sun (half, rising from horizon) -->
  <clipPath id="sunClip">
    <rect x="0" y="0" width="1200" height="260"/>
  </clipPath>
  <circle cx="600" cy="255" r="85" fill="url(#sunRad)" stroke="#FF8C00" stroke-width="2" clip-path="url(#sunClip)" filter="url(#sunGlow)"/>

  <!-- Horizontal sun reflection on water -->
  <g opacity="0.5">
    <rect x="570" y="255" width="60" height="5" rx="2" fill="#FFE94D" opacity="0.6"/>
    <rect x="560" y="262" width="80" height="4" rx="2" fill="#FFD700" opacity="0.4"/>
    <rect x="540" y="270" width="120" height="3" rx="1.5" fill="#FF8C00" opacity="0.3"/>
    <rect x="510" y="278" width="180" height="3" rx="1.5" fill="#FF8C00" opacity="0.2"/>
    <rect x="460" y="286" width="280" height="3" rx="1.5" fill="#FF6B35" opacity="0.15"/>
    <rect x="380" y="292" width="440" height="3" rx="1.5" fill="#FF4500" opacity="0.1"/>
  </g>

  <!-- Horizon water -->
  <path d="M0,255 Q200,248 400,258 Q600,268 800,255 Q1000,242 1200,255 L1200,300 L0,300 Z"
        fill="url(#seaGrad)" opacity="0.7"/>
  <path d="M0,268 Q300,260 600,272 Q900,284 1200,268 L1200,300 L0,300 Z"
        fill="#1A0050" opacity="0.5"/>

  <!-- Water wave lines -->
  <g stroke="#FF6B35" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M0,262 Q100,258 200,264 Q300,270 400,263 Q500,256 600,263 Q700,270 800,263 Q900,256 1000,264 Q1100,272 1200,262"/>
    <path d="M0,272 Q150,267 300,274 Q450,281 600,273 Q750,265 900,274 Q1050,283 1200,272"/>
  </g>

  <!-- Palm silhouettes left -->
  <g fill="#0A0015">
    <!-- Palm trunk left -->
    <path d="M80,300 Q90,220 100,180 Q105,160 110,140" stroke="#0A0015" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Palm leaves -->
    <path d="M110,140 Q80,110 50,120 Q75,105 110,140"/>
    <path d="M110,140 Q100,100 120,80 Q115,108 110,140"/>
    <path d="M110,140 Q140,100 160,115 Q130,108 110,140"/>
    <path d="M110,140 Q145,130 165,150 Q135,130 110,140"/>
    <path d="M110,140 Q90,130 65,145 Q88,128 110,140"/>

    <!-- Palm trunk right -->
    <path d="M1120,300 Q1110,220 1100,180 Q1095,160 1090,140" stroke="#0A0015" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Palm leaves right -->
    <path d="M1090,140 Q1120,110 1150,120 Q1125,105 1090,140"/>
    <path d="M1090,140 Q1100,100 1080,80 Q1085,108 1090,140"/>
    <path d="M1090,140 Q1060,100 1040,115 Q1070,108 1090,140"/>
    <path d="M1090,140 Q1055,130 1035,150 Q1065,130 1090,140"/>
    <path d="M1090,140 Q1110,130 1135,145 Q1112,128 1090,140"/>
  </g>

  <!-- Sparkle stars on horizon -->
  <g filter="url(#sunGlow)">
    <path d="M300,210 L303,220 L313,223 L303,226 L300,236 L297,226 L287,223 L297,220 Z" fill="#FFE94D" opacity="0.8"/>
    <path d="M900,210 L903,220 L913,223 L903,226 L900,236 L897,226 L887,223 L897,220 Z" fill="#FFE94D" opacity="0.8"/>
    <path d="M450,180 L452,188 L460,190 L452,192 L450,200 L448,192 L440,190 L448,188 Z" fill="#FF8C00" opacity="0.7"/>
    <path d="M750,180 L752,188 L760,190 L752,192 L750,200 L748,192 L740,190 L748,188 Z" fill="#FF8C00" opacity="0.7"/>
  </g>
</svg>
