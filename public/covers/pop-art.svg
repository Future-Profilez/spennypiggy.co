<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <pattern id="halftoneBlue" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="4" fill="#00BFFF" opacity="0.35"/>
    </pattern>
    <pattern id="halftonePink" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.5" fill="#FF69B4" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Bold yellow background -->
  <rect width="1200" height="300" fill="#FFE94D"/>

  <!-- Halftone dots overlay -->
  <rect width="600" height="300" fill="url(#halftoneBlue)"/>
  <rect x="600" y="0" width="600" height="300" fill="url(#halftonePink)"/>

  <!-- Bold color blocks -->
  <rect x="0" y="0" width="300" height="150" fill="#FF2D9B" opacity="0.85"/>
  <rect x="900" y="150" width="300" height="150" fill="#00BFFF" opacity="0.85"/>
  <rect x="600" y="0" width="200" height="300" fill="#FF4500" opacity="0.75"/>
  <rect x="0" y="200" width="180" height="100" fill="#9B59B6" opacity="0.8"/>
  <rect x="1000" y="0" width="200" height="130" fill="#2ECC71" opacity="0.8"/>

  <!-- Thick black borders between sections -->
  <line x1="300" y1="0" x2="300" y2="300" stroke="#111" stroke-width="6"/>
  <line x1="600" y1="0" x2="600" y2="300" stroke="#111" stroke-width="6"/>
  <line x1="800" y1="0" x2="800" y2="300" stroke="#111" stroke-width="6"/>
  <line x1="1000" y1="0" x2="1000" y2="300" stroke="#111" stroke-width="6"/>
  <line x1="0" y1="150" x2="300" y2="150" stroke="#111" stroke-width="5"/>
  <line x1="300" y1="100" x2="600" y2="100" stroke="#111" stroke-width="5"/>
  <line x1="800" y1="200" x2="1000" y2="200" stroke="#111" stroke-width="5"/>
  <line x1="1000" y1="130" x2="1200" y2="130" stroke="#111" stroke-width="5"/>
  <line x1="0" y1="200" x2="300" y2="200" stroke="#111" stroke-width="5"/>

  <!-- Circles pop art style -->
  <circle cx="150" cy="75" r="50" fill="#FFE94D" stroke="#111" stroke-width="5"/>
  <circle cx="150" cy="75" r="30" fill="#FF2D9B" stroke="#111" stroke-width="3"/>

  <circle cx="450" cy="200" r="45" fill="#FF2D9B" stroke="#111" stroke-width="5"/>
  <circle cx="450" cy="200" r="25" fill="#FFE94D" stroke="#111" stroke-width="3"/>

  <circle cx="700" cy="150" r="55" fill="#FFE94D" stroke="#111" stroke-width="5"/>
  <circle cx="700" cy="150" r="35" fill="#FF4500" stroke="#111" stroke-width="3"/>
  <circle cx="700" cy="150" r="15" fill="#FFE94D" stroke="#111" stroke-width="2"/>

  <circle cx="900" cy="80" r="40" fill="#9B59B6" stroke="#111" stroke-width="5"/>
  <circle cx="900" cy="80" r="22" fill="#00BFFF" stroke="#111" stroke-width="3"/>

  <circle cx="1100" cy="220" r="50" fill="#2ECC71" stroke="#111" stroke-width="5"/>
  <circle cx="1100" cy="220" r="30" fill="#FFE94D" stroke="#111" stroke-width="3"/>

  <!-- Stars comic -->
  <g fill="#FFE94D" stroke="#111" stroke-width="3">
    <polygon points="0,-22 5,-8 18,-8 8,2 12,16 0,7 -12,16 -8,2 -18,-8 -5,-8" transform="translate(300,70)"/>
    <polygon points="0,-18 4,-6 15,-6 6,2 10,13 0,5 -10,13 -6,2 -15,-6 -4,-6" transform="translate(150,240)"/>
    <polygon points="0,-22 5,-8 18,-8 8,2 12,16 0,7 -12,16 -8,2 -18,-8 -5,-8" transform="translate(1000,240)"/>
  </g>
  <g fill="#FF2D9B" stroke="#111" stroke-width="3">
    <polygon points="0,-18 4,-6 15,-6 6,2 10,13 0,5 -10,13 -6,2 -15,-6 -4,-6" transform="translate(1100,80)"/>
    <polygon points="0,-22 5,-8 18,-8 8,2 12,16 0,7 -12,16 -8,2 -18,-8 -5,-8" transform="translate(550,40)"/>
  </g>

  <!-- Bold X shapes -->
  <g stroke="#111" stroke-width="8" stroke-linecap="round">
    <line x1="380" y1="30" x2="420" y2="70"/>
    <line x1="420" y1="30" x2="380" y2="70"/>
    <line x1="820" y1="230" x2="860" y2="270"/>
    <line x1="860" y1="230" x2="820" y2="270"/>
  </g>

  <!-- Dots pattern accent -->
  <g fill="#111">
    <circle cx="50" cy="280" r="8"/><circle cx="90" cy="280" r="8"/><circle cx="130" cy="280" r="8"/>
    <circle cx="1070" cy="20" r="8"/><circle cx="1110" cy="20" r="8"/><circle cx="1150" cy="20" r="8"/>
  </g>
</svg>
