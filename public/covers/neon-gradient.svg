<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29"/>
      <stop offset="50%" stop-color="#302B63"/>
      <stop offset="100%" stop-color="#24243E"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0080" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00D9F5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0080" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="nGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nGlow2">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgNeon)"/>

  <!-- Background orbs / glow blobs -->
  <circle cx="200" cy="150" r="180" fill="#FF0080" opacity="0.08"/>
  <circle cx="600" cy="150" r="220" fill="#7928CA" opacity="0.08"/>
  <circle cx="1000" cy="150" r="180" fill="#0070F3" opacity="0.08"/>
  <circle cx="400" cy="80" r="120" fill="#00F5A0" opacity="0.06"/>
  <circle cx="800" cy="220" r="130" fill="#FF0080" opacity="0.07"/>

  <!-- Wave 1 (bottom) -->
  <path d="M0,240 Q150,200 300,230 Q450,260 600,220 Q750,180 900,220 Q1050,260 1200,220 L1200,300 L0,300 Z"
        fill="url(#wave1)" opacity="0.5"/>
  <!-- Wave 2 -->
  <path d="M0,260 Q200,230 400,255 Q600,280 800,250 Q1000,220 1200,250 L1200,300 L0,300 Z"
        fill="url(#wave2)" opacity="0.4"/>
  <!-- Wave 3 top -->
  <path d="M0,60 Q200,30 400,60 Q600,90 800,50 Q1000,10 1200,50 L1200,0 L0,0 Z"
        fill="url(#wave3)" opacity="0.35"/>

  <!-- Geometric lines -->
  <g stroke="#FF0080" stroke-width="1.5" opacity="0.3" filter="url(#nGlow)">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>

  <!-- Diagonal accent lines -->
  <g stroke="#00F5A0" stroke-width="2" opacity="0.2">
    <line x1="0" y1="0" x2="300" y2="300"/>
    <line x1="900" y1="0" x2="1200" y2="300"/>
    <line x1="500" y1="0" x2="200" y2="300"/>
    <line x1="700" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Neon circle rings -->
  <g fill="none" filter="url(#nGlow)">
    <circle cx="200" cy="150" r="70" stroke="#FF0080" stroke-width="2" opacity="0.6"/>
    <circle cx="200" cy="150" r="50" stroke="#FF0080" stroke-width="1" opacity="0.4"/>
    <circle cx="1000" cy="150" r="70" stroke="#00F5A0" stroke-width="2" opacity="0.6"/>
    <circle cx="1000" cy="150" r="50" stroke="#00F5A0" stroke-width="1" opacity="0.4"/>
    <circle cx="600" cy="150" r="90" stroke="#7928CA" stroke-width="2" opacity="0.5"/>
    <circle cx="600" cy="150" r="65" stroke="#7928CA" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Floating neon dots -->
  <g filter="url(#nGlow)">
    <circle cx="80" cy="60" r="4" fill="#FF0080" opacity="0.9"/>
    <circle cx="180" cy="40" r="3" fill="#FFD700" opacity="0.9"/>
    <circle cx="320" cy="70" r="5" fill="#00F5A0" opacity="0.9"/>
    <circle cx="480" cy="30" r="3" fill="#0070F3" opacity="0.9"/>
    <circle cx="640" cy="55" r="4" fill="#FF0080" opacity="0.9"/>
    <circle cx="760" cy="35" r="3" fill="#FFD700" opacity="0.9"/>
    <circle cx="920" cy="65" r="5" fill="#7928CA" opacity="0.9"/>
    <circle cx="1060" cy="40" r="3" fill="#00F5A0" opacity="0.9"/>
    <circle cx="1180" cy="60" r="4" fill="#FF0080" opacity="0.9"/>
    <circle cx="120" cy="240" r="3" fill="#00F5A0" opacity="0.9"/>
    <circle cx="360" cy="255" r="4" fill="#FF0080" opacity="0.9"/>
    <circle cx="560" cy="245" r="3" fill="#FFD700" opacity="0.9"/>
    <circle cx="720" cy="260" r="5" fill="#0070F3" opacity="0.9"/>
    <circle cx="880" cy="250" r="3" fill="#7928CA" opacity="0.9"/>
    <circle cx="1100" cy="255" r="4" fill="#00F5A0" opacity="0.9"/>
  </g>

  <!-- Cross sparkles -->
  <g filter="url(#nGlow2)">
    <path d="M350,150 L354,165 L368,169 L354,173 L350,188 L346,173 L332,169 L346,165 Z" fill="#FF0080"/>
    <path d="M850,150 L854,165 L868,169 L854,173 L850,188 L846,173 L832,169 L846,165 Z" fill="#00F5A0"/>
    <path d="M600,80 L604,93 L617,97 L604,101 L600,114 L596,101 L583,97 L596,93 Z" fill="#FFD700"/>
    <path d="M150,100 L153,110 L163,113 L153,116 L150,126 L147,116 L137,113 L147,110 Z" fill="#7928CA"/>
    <path d="M1050,100 L1053,110 L1063,113 L1053,116 L1050,126 L1047,116 L1037,113 L1047,110 Z" fill="#0070F3"/>
  </g>

  <!-- Thin horizontal neon line center -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="url(#wave1)" stroke-width="2" opacity="0.4" filter="url(#nGlow)"/>
</svg>
