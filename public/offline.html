<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpennyPiggy - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .offline-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
        
        .button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .features {
            margin-top: 30px;
            text-align: left;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin: 15px 0;
            opacity: 0.9;
        }
        
        .feature-icon {
            margin-right: 12px;
            font-size: 20px;
        }
        
        .network-status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        
        .online { background: rgba(76, 175, 80, 0.3); }
        .offline { background: rgba(244, 67, 54, 0.3); }
        
        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🐷</div>
        <h1>You're Offline</h1>
        <p class="subtitle">
            Don't worry! Some features of SpennyPiggy are still available while you're offline.
        </p>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">💾</span>
                <span>Your data is safely cached</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📊</span>
                <span>View your recent expenses</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✨</span>
                <span>Changes sync when you're back online</span>
            </div>
        </div>
        
        <a href="/" class="button" onclick="window.location.reload()">
            🔄 Try Again
        </a>
        
        <a href="javascript:history.back()" class="button">
            ← Go Back
        </a>
        
        <div class="network-status" id="networkStatus">
            <span id="statusText">Checking connection...</span>
        </div>
    </div>
    
    <script>
        // Check network status
        function updateNetworkStatus() {
            const statusEl = document.getElementById('networkStatus');
            const textEl = document.getElementById('statusText');
            
            if (navigator.onLine) {
                statusEl.className = 'network-status online';
                textEl.textContent = '🟢 Connection restored! You can refresh the page.';
                
                // Auto-refresh after 2 seconds if online
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                statusEl.className = 'network-status offline';
                textEl.textContent = '🔴 No internet connection detected.';
            }
        }
        
        // Listen for network changes
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        // Initial check
        updateNetworkStatus();
        
        // Periodic check every 5 seconds
        setInterval(updateNetworkStatus, 5000);
        
        // Service Worker messaging
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data && event.data.type === 'OFFLINE_PAGE_LOADED') {
                    console.log('📱 Offline page loaded via Service Worker');
                }
            });
        }
        
        // Add some interactivity
        document.addEventListener('DOMContentLoaded', () => {
            // Animate features on load
            const features = document.querySelectorAll('.feature');
            features.forEach((feature, index) => {
                feature.style.opacity = '0';
                feature.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    feature.style.transition = 'all 0.5s ease';
                    feature.style.opacity = '0.9';
                    feature.style.transform = 'translateY(0)';
                }, index * 200 + 500);
            });
        });
    </script>
</body>
</html>
