*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/*
 * ⚠️ THE HOUSE RADII, COPIED. This page cannot load the app stylesheet — it has
 * to render with no network at all — so it carries its own copy of the tokens
 * and its own breakpoint. Keep these in step with resources/css/theme.css.
 * A radius is read against the size of its element, so the container step drops
 * from 30px to 24px on a phone rather than staying fixed.
 */
:root{--sp-radius-box:24px;--sp-radius-box-sm:16px;}
@media (min-width:768px){:root{--sp-radius-box:30px;--sp-radius-box-sm:20px;}}

body{
  font-family:'SPBody',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* Never 100vh — a mobile viewport is not the height it claims. */
  min-height:100dvh;
  background:#0B0B0C;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px calc(20px + env(safe-area-inset-right,0px))
          calc(24px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px));
  -webkit-font-smoothing:antialiased;
}

/* One ambient wash, mint, so the page reads as ours rather than as a browser error. */
body::before{
  content:'';position:fixed;inset:0;pointer-events-none;
  background:radial-gradient(60% 50% at 50% 0%,rgba(5,239,184,.16),transparent 70%);
}

.card{
  position:relative;
  width:100%;
  max-width:440px;
  background:#fff;
  color:#0B0B0C;
  border:3px solid #000;
  border-radius:var(--sp-radius-box);   /* house container radius, responsive */
  padding:36px 28px 28px;
  text-align:center;
}

.badge{
  display:inline-block;
  background:#FF007F;
  color:#000;
  font-family:'SPDisplay',system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:12px;
  line-height:1;
  padding:9px 14px;
  border-radius:999px;
  margin-bottom:20px;
}

h1{
  font-family:'SPDisplay',system-ui,sans-serif;
  text-transform:uppercase;
  font-weight:400;
  font-size:clamp(34px,10vw,46px);
  line-height:.92;
  letter-spacing:-.01em;
  margin-bottom:14px;
}

/* The accent carries as a rule under the heading; it never colours the type,
   because pink on white at body weight does not clear AA. */
.rule{width:64px;height:4px;background:#FF007F;border-radius:999px;margin:0 auto 18px;}

.lede{font-size:16px;line-height:1.55;color:rgba(0,0,0,.75);margin-bottom:24px;}

.actions{display:flex;flex-direction:column;gap:12px;}

.btn{
  display:flex;align-items:center;justify-content:center;
  min-height:48px;                /* PWA touch-target floor, with headroom */
  padding:12px 22px;
  border-radius:var(--sp-radius-box-sm); /* house control radius, responsive */
  border:3px solid #000;
  font-size:16px;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  /* ⚠️ NO SCALE ON HOVER OR TAP, anywhere on this platform. */
  transition:filter .2s ease,background-color .2s ease,opacity .2s ease;
}
.btn-primary{background:#FF007F;color:#000;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:active{filter:brightness(.95);}
.btn-secondary{background:#fff;color:#0B0B0C;}
.btn-secondary:hover{background:rgba(0,0,0,.04);}
.btn-secondary:active{background:rgba(0,0,0,.08);}

.status{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:22px;padding:11px 14px;
  border-radius:var(--sp-radius-box-sm);
  font-size:14px;line-height:1.4;
  background:rgba(0,0,0,.05);
  color:rgba(0,0,0,.75);
}
.dot{width:9px;height:9px;border-radius:999px;background:rgba(0,0,0,.35);flex:0 0 auto;}
.status.is-online{background:rgba(5,239,184,.22);color:#0B0B0C;}
.status.is-online .dot{background:#03A97F;}
.status.is-offline{background:rgba(255,0,127,.12);color:#0B0B0C;}
.status.is-offline .dot{background:#C81E5B;}

@media (prefers-reduced-motion:reduce){
  .btn{transition:none;}
}
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Offline</span>
    <h1>No connection</h1>
    <div class="rule"></div>
    <!--
      ⚠️ HONEST COPY ONLY. The page this replaced promised "your data is safely
      cached", "access your account & creator links" and "changes sync when
      you're back online". None of that is true — there is no background sync in
      this app and no account data is available offline. Reassurance the product
      cannot honour is worse than none, so this says what is actually the case.
    -->
    <p class="lede">Spenny Piggy needs a connection to load your account, your purchases and anything you are buying. Nothing you were doing has been lost — it just needs signal.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary" id="retry">Try again</a>
      <!-- 🚨 NOT a `javascript:` URL in an href. That is script under the CSP
           (`script-src`, no 'unsafe-inline'), so the button silently did nothing on
           the one screen a user reaches when everything else has already failed.
           The handler is attached in the nonced script below. -->
      <button type="button" class="btn btn-secondary" id="goBack">Go back</button>
    </div>
    <p class="status" id="status"><span class="dot"></span><span id="statusText">Checking your connection…</span></p>
  </main>

<!-- ⚠️ `__CSP_NONCE__` is substituted by the `offline.page` route. This file is
     plain HTML with no Blade, and the CSP carries no 'unsafe-inline', so without
     the placeholder this whole block is refused and the page cannot tell the user
     when their connection comes back. The service worker caches the RESPONSE, so
     the cached copy keeps the nonce it was served with. -->
<script nonce="__CSP_NONCE__">
(function () {
  var back = document.getElementById('goBack');
  if (back) {
    back.addEventListener('click', function () { history.back(); });
  }

  var el = document.getElementById('status');
  var text = document.getElementById('statusText');
  var reloading = false;

  function render() {
    if (navigator.onLine) {
      el.className = 'status is-online';
      text.textContent = 'Back online — reloading…';
      // Only ever schedule this once; two reload timers race and flicker.
      if (!reloading) {
        reloading = true;
        setTimeout(function () { window.location.reload(); }, 1200);
      }
    } else {
      el.className = 'status is-offline';
      text.textContent = 'Still no connection.';
    }
  }

  window.addEventListener('online', render);
  window.addEventListener('offline', render);
  document.getElementById('retry').addEventListener('click', function (e) {
    e.preventDefault();
    window.location.reload();
  });
  render();
  // navigator.onLine can lie about a captive portal, so keep checking rather
  // than trusting the first answer.
  setInterval(render, 5000);
})();
</script>
</body>
</html>
