; PHP Performance Optimization Configuration
; This file contains recommended settings for optimal Laravel performance

; ====================
; OPcache Configuration
; ====================

; Enable OPcache
opcache.enable=1
opcache.enable_cli=1

; Memory Configuration
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000

; File Validation
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.save_comments=1

; Performance Tweaks
opcache.fast_shutdown=1
opcache.enable_file_override=1
opcache.optimization_level=0x7FFFBFFF

; File Cache (for better performance across deployments)
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0

; ====================
; JIT Configuration (PHP 8.0+)
; ====================

; Enable JIT
opcache.jit_buffer_size=100M
opcache.jit=tracing

; JIT Optimization Modes:
; - disable: 0
; - on: 1235 (recommended for most web applications)
; - tracing: 1254 (recommended for CPU-intensive applications)
; - function: 1205

; ====================
; Realpath Cache
; ====================
realpath_cache_size=4096K
realpath_cache_ttl=7200

; ====================
; General PHP Performance
; ====================

; Memory limits
memory_limit=256M
max_execution_time=30
max_input_time=60

; File uploads
upload_max_filesize=20M
post_max_size=25M
max_file_uploads=20

; Session optimization
session.save_handler=redis
session.save_path="tcp://127.0.0.1:6379"
session.gc_maxlifetime=86400

; ====================
; Production Optimizations
; ====================

; Disable unnecessary extensions for production
; extension=xdebug (comment out in production)

; Error reporting (disable in production)
; display_errors=Off
; log_errors=On
; error_log=/var/log/php_errors.log

; ====================
; Additional Performance Settings
; ====================

; Preload (PHP 7.4+)
; opcache.preload=/path/to/your/app/preload.php
; opcache.preload_user=www-data

; Date timezone
date.timezone=UTC

; Output buffering
output_buffering=4096
output_handler=

; Compression
zlib.output_compression=On
zlib.output_compression_level=6
